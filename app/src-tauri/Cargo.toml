[package]
name = "claudebolt"
version = "0.1.0"
description = "Local-first automatic video/audio editor"
edition = "2021"

[lib]
name = "claudebolt_lib"
# desktop only needs the rlib; staticlib/cdylib (mobile) would compile and LTO the crate twice more
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# no "zip" feature: it only handles v1-style zipped installers and gzipped AppImages (we ship
# neither), and every zip release it accepts has been yanked from crates.io
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4"

[profile.release]
opt-level = "s"
# thin, not fat: fat LTO serialises the final link and saves only ~1.7 MB next to the ~450 MB bundled engine
lto = "thin"
strip = true
