[package]
name = "claudebolt"
version = "0.1.0"
description = "Local-first automatic video/audio editor"
edition = "2021"

[lib]
name = "claudebolt_lib"
# desktop only needs the rlib; staticlib/cdylib (mobile) would compile and LTO the crate twice more
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin" # fat LTO serialises the final link over every dependency; thin is near-identical in size
strip = true
